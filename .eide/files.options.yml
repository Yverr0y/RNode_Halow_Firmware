##########################################################################################
#                        Append Compiler Options For Source Files
##########################################################################################

# syntax:
#   <your pattern>: <compiler options>
# For get pattern syntax, please refer to: https://www.npmjs.com/package/micromatch
#
# examples:
#   'main.cpp':           --cpp11 -Og ...
#   'src/*.c':            -gnu -O2 ...
#   'src/lib/**/*.cpp':   --cpp11 -Os ...
#   '!Application/*.c':   -O0
#   '**/*.c':             -O2 -gnu ...

version: "2.1"
options:
    Debug:
        files:
            # hot TCP<->RF pipeline files: -O2 (appended after -Os, last wins)
            'src/halow_ack.c': -O2
            'src/halow_pkg_handler.c': -O2
            'src/tcp_server.c': -O2
            'src/rns/stream_parser.c': -O2
        virtualPathFiles: {}
    Release:
        files:
            'src/halow_ack.c': -O2
            'src/halow_pkg_handler.c': -O2
            'src/tcp_server.c': -O2
            'src/rns/stream_parser.c': -O2
        virtualPathFiles: {}
