name: beta-release

# Manual run: Actions -> beta-release -> Run workflow -> version like v2.1.2b.
# The tag is created automatically at the current main HEAD.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta tag (must end with 'b', e.g. v2.1.2b)"
        required: true
        default: "v2.1.2b"

permissions:
  contents: write

jobs:
  beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version format (vX.Y.Zb)
        run: |
          v="${{ inputs.version }}"
          echo "$v" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+b$' \
            || { echo "::error::version must look like v2.1.2b (trailing b), got: $v"; exit 1; }

      - name: C-SKY toolchain (csky-elfabiv2 V3.10.33, linux x86_64)
        run: |
          git clone --depth 1 https://github.com/I-AM-ENGINEER/csky-toolchain.git /tmp/tcrepo
          mkdir -p "$GITHUB_WORKSPACE/tc"
          tar xzf /tmp/tcrepo/linux/csky-elfabiv2-tools-x86_64-minilibc-20250328.tar.gz -C "$GITHUB_WORKSPACE/tc"
          "$GITHUB_WORKSPACE/tc/bin/csky-elfabiv2-gcc" --version

      - name: python alias
        run: |
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
          python --version

      - name: Build (host-test gate, firmware, pack)
        run: |
          make prebuild
          make COMPILER_DIR="$GITHUB_WORKSPACE/tc" -j"$(nproc)"

      - name: Package release tar (fw.bin + www/, plain tar)
        run: |
          TAG="${{ inputs.version }}"
          NAME="RNode-Halow-${TAG//./_}"
          tar -cf "${NAME}.tar" -C out fw.bin -C "$PWD/out/_filesystem" www
          tar -tvf "${NAME}.tar"
          sha256sum "${NAME}.tar" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish prerelease (tag auto-created, placeholder body)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          prerelease: true
          body: PLACEHOLDER
          files: RNode-Halow-*.tar
